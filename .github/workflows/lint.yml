name: lint

on:
  push:
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the v4.4.0 release commit (the v4 tag points at it):
      # a tag can be moved, a commit cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Shellcheck
        # Pinned to the 2.0.0 release commit: a tag can be moved, a commit cannot.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          additional_files: kbled
          ignore_paths: .git
        env:
          SHELLCHECK_OPTS: -e SC1091

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tests
        run: bash tests/run.sh
