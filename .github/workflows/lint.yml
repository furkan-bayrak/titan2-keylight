name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          additional_files: kbled
          ignore_paths: .git
        env:
          SHELLCHECK_OPTS: -e SC1091
